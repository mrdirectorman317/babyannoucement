name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    name: Python + C# type-check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: TLS integration smoke (Python <-> Python)
        run: python3 tools/integration_smoke.py
      - name: Integration message flows (demo mock)
        run: python3 tools/demo_smoke.py
      - name: Shader HLSL syntax check (glslang, Unity macros stubbed)
        run: |
          sudo apt-get install -y -qq glslang-tools
          python3 tools/check_shaders.py
      - name: Video path (mock host streams real H.264, ffmpeg decodes it)
        run: |
          sudo apt-get install -y -qq ffmpeg
          python3 tools/video_smoke.py
      - name: Engine-free Unity math unit tests (One Euro filter)
        run: dotnet test quest/mathtests
      - name: Android decoder plugin (compiles vs Android API, JNI binding runs, arm64 helper builds)
        run: |
          sudo apt-get install -y -qq clang lld llvm
          bash scripts/check-android-plugin.sh
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Unity runtime scripts type-check (default symbols)
        run: dotnet build quest/typecheck -v q
      - name: Unity runtime scripts type-check (UNITY_ANDROID branches)
        run: dotnet build quest/typecheck -v q -p:Android=true

  macos:
    name: Mac host build + tests (real Apple SDK)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build host (ScreenCaptureKit, Network, App Intents code, ...)
        working-directory: macOS
        run: |
          set +e
          swift build -c release --product SpatialMacHost > build.log 2>&1
          code=$?
          echo "---- unique compiler errors ----"
          grep -E "error:" build.log | sed -E 's#^.*/Sources/#Sources/#' | sort -u | head -60
          tail -3 build.log
          exit $code
      - name: Swift tests (SpatialCore + SpatialMedia encode/decode on real VideoToolbox)
        working-directory: macOS
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log | grep -E "Test Case .*(passed|failed|skipped)|Executed [0-9]+ tests|error:|ENCODER|XCTSkip|skipped" | sed -E 's/^.*Test Case /Test Case /' | tail -80
      - name: Build as a real Xcode app (App Intents metadata for Siri)
        run: |
          set -o pipefail
          brew install xcodegen
          cd macOS && xcodegen generate --spec project.yml
          xcodebuild -project SpatialMac.xcodeproj -scheme SpatialMacApp -configuration Release \
            -derivedDataPath ../Build/DerivedData CODE_SIGN_IDENTITY=- build > ../xcb.log 2>&1 || { grep -E 'error:' ../xcb.log | sed -E 's#^.*/Sources/#Sources/#' | sort -u | head -60; exit 1; }
          tail -2 ../xcb.log
          APP=../Build/DerivedData/Build/Products/Release/SpatialMacHost.app
          echo "---- products ----"; find ../Build/DerivedData/Build/Products -maxdepth 3 | head -20
          echo "---- app bundle ----"; find "$APP" -maxdepth 3 | sed "s#^$APP#APP#" | head -30
          echo "---- appintents lines in build log ----"; grep -i "appintents" ../xcb.log | cut -c1-220 | head -12
          test -d "$APP/Contents/Resources/Metadata.appintents" || { echo "MISSING Metadata.appintents: Siri/Shortcuts would not find the intents"; exit 1; }
          echo "OK: Metadata.appintents present"
