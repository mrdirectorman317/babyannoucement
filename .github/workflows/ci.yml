name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    name: Python + C# type-check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: TLS integration smoke (Python <-> Python)
        run: python3 tools/integration_smoke.py
      - name: Integration message flows (demo mock)
        run: python3 tools/demo_smoke.py
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Unity runtime scripts type-check (default symbols)
        run: dotnet build quest/typecheck -v q
      - name: Unity runtime scripts type-check (UNITY_ANDROID branches)
        run: dotnet build quest/typecheck -v q -p:Android=true

  macos:
    name: Mac host build + tests (real Apple SDK)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build host (ScreenCaptureKit, Network, App Intents code, ...)
        working-directory: macOS
        run: |
          set +e
          swift build -c release --product SpatialMacHost > build.log 2>&1
          code=$?
          echo "---- unique compiler errors ----"
          grep -E "error:" build.log | sed -E 's#^.*/Sources/#Sources/#' | sort -u | head -60
          tail -3 build.log
          exit $code
      - name: Swift tests (SpatialCore)
        working-directory: macOS
        run: swift test 2>&1 | tail -15
      - name: Build as a real Xcode app (App Intents metadata for Siri)
        run: |
          brew install xcodegen
          cd macOS && xcodegen generate --spec project.yml
          xcodebuild -project SpatialMac.xcodeproj -scheme SpatialMacHost -configuration Release \
            -derivedDataPath ../Build/DerivedData CODE_SIGN_IDENTITY=- build > ../xcb.log 2>&1 || { grep -E 'error:' ../xcb.log | sed -E 's#^.*/Sources/#Sources/#' | sort -u | head -60; exit 1; }
          tail -3 ../xcb.log
          ls ../Build/DerivedData/Build/Products/Release/SpatialMacHost.app/Contents/Resources | head
